name: Validate YAML

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    paths:
      - "**/*.ya?ml"

jobs:
  validate-yaml:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Validate YAML file
        run: make lint-yaml
