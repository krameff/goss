name: Docker image for Goss

on:
  push:
    branches:
      - main
      - devel
  workflow_dispatch:

env:
  PLATFORMS: "linux/amd64,linux/arm64"

jobs:
  goss:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      security-events: write  # To upload Trivy sarif files

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/goss

      - name: Build goss binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --clean --snapshot
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Stage docker build context
        run: |
          set -euo pipefail
          mkdir -p linux/amd64 linux/arm64
          cp dist/goss_linux_amd64_*/goss linux/amd64/goss
          cp dist/goss_linux_arm64_*/goss linux/arm64/goss

      - name: Build main goss image
        if: github.ref_name == 'main'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/goss:main
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}

      - name: Build devel goss image
        if: github.ref_name == 'devel'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/goss:devel
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}

      - name: Run Trivy vulnerability scanner (main)
        if: github.ref_name == 'main'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/goss:main
          format: sarif
          output: trivy-main-results.sarif

      - name: Run Trivy vulnerability scanner (devel)
        if: github.ref_name == 'devel'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/goss:devel
          format: sarif
          output: trivy-devel-results.sarif

      - name: Upload Trivy scan results (main) to GitHub Security tab
        if: github.ref_name == 'main'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-main-results.sarif

      - name: Upload Trivy scan results (devel) to GitHub Security tab
        if: github.ref_name == 'devel'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-devel-results.sarif
