name: Golang ci
on:
  # don't build any branch other than main (and prs) when git pushed
  pull_request: {}
  push:
    branches:
      - main
      - "/^v\\d+\\.\\d+(\\.\\d+)?(-\\S*)?$/"
      - devel
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          install-mode: goinstall

  coverage:
    needs: [lint]
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Unit tests and coverage
        run: make cov

      - name: Discovery E2E
        run: make test-discovery-e2e

      - name: Depends-on E2E
        run: make test-depends-on-e2e

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567

      - name: Security scan
        env:
          SECURITY_STRICT: "1"
        run: ./ci/security-scan.sh

  integration-test-linux:
    needs: [coverage]
    name: Integration tests (linux/${{ matrix.distro }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: [rockylinux9, almalinux10, bullseye, jammy, alpine3, arch, test-int-serve-linux-amd64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Integration tests
        shell: bash
        run: make ${{ matrix.distro }}

  integration-test-linux-ppc64le:
    needs: [coverage]
    name: Integration tests (linux/ppc64le)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ppc64le
      - name: Integration tests
        shell: bash
        run: make test-int-validate-linux-ppc64le test-int-serve-linux-ppc64le

  integration-test-linux-arm64:
    needs: [coverage]
    name: Integration tests (linux/arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Integration tests
        shell: bash
        run: make test-int-validate-linux-arm64 test-int-serve-linux-arm64

  integration-test-other:
    needs: [coverage]
    name: Integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Unit tests
        shell: bash
        run: make test

      - name: Integration tests
        shell: bash
        run: |
          os_name="$(go env GOOS)"
          arch="$(go env GOARCH)"
          make "test-int-validate-${os_name}-${arch}" "test-int-serve-${os_name}-${arch}"
