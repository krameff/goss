---
service:
  webservice:
    enabled: false
    running: false
{{ if .Env.OS | regexMatch "centos[7]|rockylinux[9]|almalinux10" }}
  httpd:
{{else}}
  apache2:
{{end}}
    enabled: true
    running: true
{{ if .Env.OS | regexMatch "alpine3" }}
    runlevels: ["sysinit"]
{{ else if .Env.OS | regexMatch "centos7|rockylinux9|almalinux10|jammy|bullseye" }}
    runlevels: []
{{end}}
  skippable:
    enabled: true
    running: true
    skip: true
